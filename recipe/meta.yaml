{% set name = "mne-bids" %}
{% set version = "0.20.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 8d196664a2f0a3bd2d5afd41777cf6cf43606201c3b9118ab43dc92758681c23

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  entry_points:
    - mne_bids = mne_bids.commands.run:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - mne-base >=1.8
    - numpy >=1.23
    - scipy >=1.9
    - curryreader >=0.1.2
    - defusedxml
    - edfio >=0.4.10
    - eeglabio >=0.1.0
    - filelock >=3.20.4
    - h5py !=3.15.0
    - hedtools
    - matplotlib-base >=3.6
    - mffpy >=0.11
    - nibabel >=3.2.1
    - pandas >=1.3.2
    - pybv >=0.7.5
    - pymatreader

test:
  requires:
    - python {{ python_min }}
  imports:
    - mne_bids
  commands:
     # Test the entry point.
    - mne_bids --version

about:
  home: https://mne.tools/mne-bids/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: An MNE project for organizing and formatting MEG and EEG data according to the BIDS specification
  dev_url: https://github.com/mne-tools/mne-bids

extra:
  recipe-maintainers:
    - larsoner
    - hoechenberger
    - jasmainak
    - sappelhoff
